<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Graduation cap - educational symbol -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>

  <!-- Book pages -->
  <path d="M30 45 L30 65 L50 60 L50 40 Z" fill="#fff" opacity="0.9"/>
  <path d="M50 40 L50 60 L70 65 L70 45 Z" fill="#fff" opacity="0.7"/>

  <!-- Book spine -->
  <rect x="48" y="40" width="4" height="25" fill="#e0e7ff"/>

  <!-- Graduation cap top -->
  <path d="M35 35 L50 30 L65 35 L50 38 Z" fill="#fbbf24"/>

  <!-- Cap tassel -->
  <circle cx="65" cy="36" r="2" fill="#fbbf24"/>
  <line x1="65" y1="36" x2="67" y2="40" stroke="#fbbf24" stroke-width="1"/>
</svg>
